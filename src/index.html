<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nebochod</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="container">
            <h1>Placeholder</h1>
            <p>This is a placeholder for the Nebochod website.</p>
            <p>More content will be added here in the future.</p>
            <div>
                <button id="incrementButton">Click me to increment the counter!</button>
                <p id="counter">0</p>
            </div>
        </div>
        <form id="login-form">
            <label>
                Username:
                <input type="text" id="username" name="username" required>
            </label>
            <br><br>
            <label>
                Password:
                <input type="password" id="password" name="password" required>
            </label>
            <br><br>
            <button type="submit">Login</button>
        </form>
        <p id="message"></p>
        <script src="api.js"></script>
        <script src="login.js"></script>
        <script src="script.js"></script>
    </body>
</html>
